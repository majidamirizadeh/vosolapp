# با هر تغییر در پوشه downloads یا فایل‌های برنامه، فهرست دانلودها و نسخه برنامه خودکار به‌روز می‌شود.
name: build-index
on:
  push:
    branches: [main]
    paths-ignore: ["downloads/index.json", "sw.js"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/build.mjs
      - name: commit
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add downloads/index.json sw.js
          git diff --cached --quiet || git commit -m "build: update downloads index and service worker"
          git push
